<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次启动 · MeetSieve</title><link rel="stylesheet" href="assets/meetsieve.css"><script src="assets/meetsieve.js" defer></script></head>
<body>
  <main class="content" style="max-width:920px;padding-top:64px">
    <section data-od-id="onboarding-head"><p class="eyebrow">首次启动 · 1 / 3</p><h1>选择会议工作目录</h1><p class="muted" style="font-size:17px">录音、原始记录、附件、声纹样本与数据库都会保存在这里。MeetSieve 不会静默创建新的空库。</p></section>
    <section class="card" data-od-id="onboarding-directory" style="margin-top:32px">
      <label class="label">会议工作目录<div class="row"><input class="field num" value="D:\MeetSieve"><button class="btn btn-quiet">浏览</button></div><span class="help">需要可写权限，建议至少保留 10 GB 空间。</span></label>
      <div class="notice" style="margin-top:20px"><span class="status ok">检查通过</span><div><strong>目录可写，数据库尚未创建</strong><div class="muted">确认后将创建 data、meetings、members 与 logs 目录。</div></div></div>
      <hr class="rule">
      <div class="grid grid-3"><div><p class="meta">麦克风</p><strong>系统默认输入</strong><p class="muted">电平正常</p></div><div><p class="meta">实时转写</p><strong>需要配置</strong><p class="muted">可稍后在设置中完成</p></div><div><p class="meta">Codex</p><strong>已找到</strong><p class="muted num">codex 0.42.0</p></div></div>
      <div class="row-between" style="margin-top:28px"><button class="btn btn-quiet" data-open="repair">模拟目录修复</button><a class="btn btn-primary" href="index.html">创建目录并继续</a></div>
    </section>
  </main>
  <div class="modal-backdrop" id="repair"><div class="modal"><h2>原工作目录不可用</h2><p class="muted">请选择原目录的新位置。若无法恢复，可明确创建全新目录；现有会议不会自动出现。</p><label class="label">重新定位<input class="field num" value="E:\Archive\MeetSieve"></label><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn btn-primary">验证目录</button></div></div></div>
</body>
</html>
