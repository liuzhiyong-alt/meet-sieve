<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>录入声纹 · MeetSieve</title>
  <link rel="stylesheet" href="assets/meetsieve.css">
  <script src="assets/meetsieve.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-mark">M</span><span>MeetSieve</span></a>
      <nav class="nav"><a href="start.html">开始会议</a><a href="records.html">会议记录</a><a class="active" href="people.html">常用小组</a><a href="settings.html">设置</a></nav>
      <div class="sidebar-foot">成员与声纹仅保存在本机</div>
    </aside>
    <main class="main">
      <header class="titlebar"><span class="meta">常用小组</span><div class="window-controls"><i></i><i></i><i></i></div></header>
      <div class="content">
        <section class="page-head"><div><p class="eyebrow">本地成员库</p><h1>小组与成员</h1><p>小组加快会前选择；历史会议始终保留当时的参会者快照。</p></div><button class="btn btn-primary">新建</button></section>
        <section class="tabs"><button class="tab">小组</button><button class="tab active">成员</button></section>
        <section class="card" style="margin-top:20px"><ul class="list"><li class="list-item"><div class="row"><span class="avatar">刘</span><div><strong>刘毅</strong><div class="meta">2 个声纹样本 · 质量可用</div></div></div><button class="btn">管理声纹</button></li></ul></section>
      </div>
    </main>
  </div>

  <div class="modal-backdrop open" id="voice-enrollment">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="voice-enrollment-title" aria-describedby="voice-enrollment-help">
      <h2 id="voice-enrollment-title">录入刘毅的声纹</h2>
      <p id="voice-enrollment-help" class="muted">请选择一种会前采集方式。录音和声纹特征仅保存在本机。</p>
      <section data-tabs="voice-source" class="tabs" aria-label="声纹采集方式">
        <button class="tab active" data-tab="voice-record">直接录音</button>
        <button class="tab" data-tab="voice-upload">上传 WAV</button>
      </section>

      <section id="voice-record" data-tab-panel="voice-source" style="margin-top:20px">
        <div class="notice"><strong>自然朗读</strong><p class="muted">建议录制 10–30 秒，并与麦克风保持稳定距离。最长可录制 60 秒。</p></div>
        <label class="label" style="margin-top:18px">麦克风<select class="select"><option>系统默认麦克风</option></select></label>
        <div class="row-between" style="margin-top:20px"><div><strong>等待录音</strong><div class="meta">00:00 / 01:00</div></div><div class="audio-bar" aria-label="当前没有检测到语音"><i style="--h:8px"></i><i style="--h:8px"></i><i style="--h:8px"></i><i style="--h:8px"></i><i style="--h:8px"></i></div></div>
        <div class="modal-actions"><a class="btn" href="people.html#members">返回成员列表</a><button class="btn btn-primary" type="button">开始录音</button></div>
      </section>

      <section id="voice-upload" data-tab-panel="voice-source" hidden style="margin-top:20px">
        <div class="notice"><strong>选择单人语音文件</strong><p class="muted">支持最长 60 秒的 PCM WAV。文件会转换为统一格式，原始上传文件不会长期保留。</p></div>
        <label class="label" style="margin-top:18px">WAV 文件<div class="row"><input class="field num" value="尚未选择文件" readonly><button class="btn btn-quiet" type="button">选择文件</button></div></label>
        <label class="label" style="margin-top:18px">录音环境<select class="select"><option>安静环境</option><option>会议室</option><option>其他环境</option></select></label>
        <div class="modal-actions"><a class="btn" href="people.html#members">返回成员列表</a><button class="btn btn-primary" type="button" disabled title="请先选择 WAV 文件">处理并保存</button></div>
      </section>
    </div>
  </div>
</body>
</html>
