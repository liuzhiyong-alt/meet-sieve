<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>会议详情 · Step 9 提案 · MeetSieve</title>
    <link rel="stylesheet" href="../../style/meet-sieve/tokens.css" />
    <link rel="stylesheet" href="../assets/meetsieve.css" />
    <link rel="stylesheet" href="step9-proposal.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="../index.html"
          ><span class="brand-mark">M</span><span>MeetSieve</span></a
        >
        <nav class="nav" aria-label="主导航">
          <a href="../start.html">开始会议</a
          ><a class="active" aria-current="page" href="../records.html"
            >会议记录</a
          ><a href="../people.html">常用小组</a
          ><a href="../settings.html">设置</a>
        </nav>
        <div class="sidebar-foot">
          <span class="status ok">本地已保存</span>
        </div>
      </aside>
      <main class="main">
        <header class="titlebar">
          <a href="records.html">← 返回会议记录</a>
          <div class="row">
            <button class="btn btn-quiet" type="button">导出本场诊断</button>
          </div>
        </header>
        <div class="content">
          <section class="page-head">
            <div>
              <p class="eyebrow">20260731-A7K2-03</p>
              <h1>AI 会议助手产品评审</h1>
              <p class="num">2026 年 7 月 31 日 09:30–10:18 · 4 位参会人</p>
            </div>
            <button class="btn btn-quiet detail-codex-action" type="button">
              用 Codex 继续
            </button>
          </section>
          <nav class="tabs" aria-label="会议详情">
            <a class="tab" href="#transcript">原始记录</a
            ><a class="tab active" href="#minutes">会议纪要</a
            ><a class="tab" href="#messages">消息与资料</a>
          </nav>
          <section class="step9-layout section-offset">
            <article class="card">
              <div class="card-head">
                <div>
                  <p class="meta">当前版本</p>
                  <h2>会议纪要草稿</h2>
                </div>
                <span class="status warn">未确认</span>
              </div>
              <p class="muted">
                纪要工作区、原始记录和会议消息均在同一会议详情中按需加载。
              </p>
              <div class="notice warn">
                <strong>仍有转写缺口</strong
                ><span class="num">00:37:14–00:39:02</span>
              </div>
            </article>
            <aside class="card">
              <h3>本场状态</h3>
              <ul class="list">
                <li class="list-item">
                  <span>录音</span><span class="status ok">可播放</span>
                </li>
                <li class="list-item">
                  <span>本地保存</span><span class="status ok">已完成</span>
                </li>
                <li class="list-item">
                  <span>缺口补转写</span><span class="status warn">待处理</span>
                </li>
                <li class="list-item">
                  <span>Codex 同步</span><span class="status bad">可重试</span>
                </li>
              </ul>
            </aside>
          </section>
        </div>
      </main>
    </div>
