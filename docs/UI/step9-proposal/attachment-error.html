    <div class="app">
      <aside class="sidebar">

            <div>
              <p class="eyebrow">20260731-A7K2-03 · 会议消息</p>
              <h1>附件与链接</h1>
              <p>

              </p>
            </div>
            <span class="status warn">有 2 项不可用</span>
          </section>
          <section class="card stack">

              <div class="stage-copy">

                >

            </div>
            <div class="file-state">
              <div class="stage-copy">
                <strong>上线检查表.xlsx</strong
                ><span class="muted"
                  >文件内容与登记的 SHA-256

                >
              </div>
              <span class="status bad">文件已变化</span>
            </div>
            <div class="file-state">
              <div class="stage-copy">
                <strong>火山引擎接入说明</strong
                ><span class="meta">即将通过默认浏览器打开 volcengine.com</span>
