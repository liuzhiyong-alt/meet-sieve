<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会议消息 · MeetSieve</title><link rel="stylesheet" href="assets/meetsieve.css"><script src="assets/meetsieve.js" defer></script></head>
<body>
  <main style="max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding:24px 18px 100px">
    <section data-od-id="guest-head"><div class="brand" style="padding-left:0"><span class="brand-mark">M</span><span>会议消息</span></div><p class="eyebrow">AI 会议助手产品评审</p><h1 style="font-size:32px">加入本场会议</h1><p class="muted">填写临时显示名称。这里不展示录音、实时转写、正式成员库或会后纪要。</p></section>
    <section class="card" data-od-id="guest-identity"><label class="label">你的显示名称<input class="field" value="林舟"></label><button class="btn btn-primary" style="width:100%;margin-top:14px">进入会议消息</button></section>
    <section class="card" data-od-id="guest-messages"><div class="card-head"><h3>会议消息</h3><span class="status ok">会议进行中</span></div><div class="stack"><div class="notice"><div><strong>刘毅</strong><p style="margin:4px 0">大家可以把 Windows 验收资料发到这里。</p><span class="meta num">09:42</span></div></div><div class="notice"><div><strong>AI 助手</strong><p style="margin:4px 0">迁移失败时应保持旧目录为唯一事实源。</p><span class="meta num">09:53</span></div></div></div><hr class="rule"><label class="label">发送消息<textarea class="textarea" placeholder="输入文字或粘贴链接"></textarea></label><div class="row-between" style="margin-top:12px"><button class="btn btn-quiet">添加文件</button><button class="btn btn-primary">发送</button></div><p class="help">单个附件最大 500 MB；可执行文件、安装包与动态库不可上传。</p></section>
  </main>
</body>
</html>
